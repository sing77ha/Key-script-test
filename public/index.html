<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Key System</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <div class="card">

            <div class="logo">

            <h1>

            <p class="description">
                รับ Key สำหรับเข้าสู่ Script Hub

            <div class="ad-box">

                </div>

                <p>
                    พื้นที่สำหรับโฆษณาของคุณ

            <button id="claimButton">

            <div id="result" class="result hidden"></div>
<div class="verify-section">

    <input
        id="verifyKey"
        type="text"
        placeholder="ใส่ Key ของคุณ"
        autocomplete="off"

    <input
        id="robloxUserId"
        type="text"
        placeholder="Roblox User ID"
        autocomplete="off"
    >

    <button id="verifyButton">
        ✅ Verify Key
    </button>

    <div id="verifyResult" class="result hidden"></div>

</div>
            <p class="footer">

        </div>
